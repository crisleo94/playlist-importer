<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm"
     x-data="{
        open: true,
        submitting: false,
        inputUrl: ''
     }"
     x-show="open"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0">

    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden"
         @click.away="open = false; setTimeout(() => document.getElementById('modal-container').innerHTML = '', 200)">

        <!-- Header -->
        <div class="p-5 border-b border-slate-800 flex items-center justify-between bg-slate-900/90">
            <div class="flex items-center gap-2.5">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
                <h3 class="font-bold text-base text-slate-100">Cargar Playlist por Enlace o ID</h3>
            </div>
            <button @click="open = false; setTimeout(() => document.getElementById('modal-container').innerHTML = '', 200)"
                    class="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-800 transition">
                ✕
            </button>
        </div>

        <!-- Formulario -->
        <form hx-post="{% url 'importer:import_by_url' %}"
              hx-target="#modal-container"
              hx-indicator="#import-url-spinner"
              @submit="submitting = true"
              class="p-5 space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">
                    URL o ID de la Playlist (Spotify o YouTube)
                </label>
                <input type="text"
                       name="playlist_url"
                       x-model="inputUrl"
                       required
                       autofocus
                       placeholder="Ej. https://open.spotify.com/playlist/... o https://music.youtube.com/playlist?list=..."
                       class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
                <p class="text-[11px] text-slate-500 mt-1.5">
                    Compatible con enlaces públicos y colaborativos de Spotify, YouTube y YouTube Music, o IDs directos (ej. <code class="text-slate-400">PL...</code>).
                </p>
            </div>

            <div id="import-url-error" class="hidden"></div>

            <div class="pt-2 flex items-center justify-between">
                <button type="button"
                        @click="open = false; setTimeout(() => document.getElementById('modal-container').innerHTML = '', 200)"
                        class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium transition">
                    Cancelar
                </button>

                <button type="submit"
                        :disabled="submitting || !inputUrl.trim()"
                        :class="(submitting || !inputUrl.trim()) ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer hover:bg-emerald-500'"
                        class="px-4 py-2 rounded-lg bg-emerald-600 text-white text-xs font-bold transition flex items-center gap-2 shadow-md shadow-emerald-950">
                    <span id="import-url-spinner" class="htmx-indicator animate-spin text-xs">⟳</span>
                    <span x-text="submitting ? 'Inspeccionando...' : 'Inspeccionar y Transferir'">Inspeccionar y Transferir</span>
                    <span x-show="!submitting">➔</span>
                </button>
            </div>
        </form>
    </div>
</div>
